apply plugin: 'com.android.application'
apply plugin: 'signing'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../build_common/version_common.gradle'

android {

    namespace = "paulscode.android.mupen64plusae"

    allprojects {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }

        repositories {
            mavenCentral()
            google()
        }
    }

    buildFeatures.viewBinding = true
    buildFeatures.compose = true
    buildFeatures.buildConfig = true

    defaultConfig {
        applicationId = "org.victoriousframework.victorlink64"
        buildConfigField "String", "RELAY_URL", '"wss://victorlink64-relay.victorlink64.workers.dev"'
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        debug {
            minifyEnabled false
            jniDebuggable true
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
		
        android.applicationVariants.all { variant ->
            variant.outputs.all { output ->
                def builtType = variant.buildType.name
                outputFileName = "VictorLink64-${builtType}.apk"
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    sourceSets {
        main {
            debug {
                jniLibs.srcDirs += '../ndkLibs/libs/debug'
            }
            release {
                jniLibs.srcDirs += '../ndkLibs/libs/release'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/beans.xml']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

// libGDX ships its Android natives as jars of .so files; unpack them per ABI into a jniLibs source dir.
configurations { gdxNatives }
def gdxNativesDir = layout.buildDirectory.dir('gdx-natives').get().asFile
tasks.register('extractGdxNatives') {
    inputs.files(configurations.gdxNatives)
    outputs.dir(gdxNativesDir)
    doLast {
        def root = gdxNativesDir
        root.deleteDir()
        configurations.gdxNatives.files.each { jar ->
            def abi = jar.name.substring(jar.name.indexOf('natives-') + 8, jar.name.length() - 4)
            ant.unzip(src: jar, dest: new File(root, abi)) { patternset { include(name: '*.so') } }
        }
    }
}
android.sourceSets.main.jniLibs.srcDir(gdxNativesDir)
tasks.named('preBuild') { dependsOn 'extractGdxNatives' }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_configuration_nio:2.1.5'

    def lifecycle_version = "2.9.3"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"

    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"

    // alternately - if using Java8, use the following instead of lifecycle-compiler
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // optional - helpers for implementing LifecycleOwner in a Service
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"

    // optional - ProcessLifecycleOwner provides a lifecycle for the whole application process
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    // optional - ReactiveStreams support for LiveData
    implementation "androidx.lifecycle:lifecycle-reactivestreams:$lifecycle_version"

    implementation "androidx.concurrent:concurrent-futures:1.3.0"

    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.apache.commons:commons-text:1.14.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'

    implementation ('net.java.dev.jna:jna-platform:5.17.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // org.json is stubbed in android.jar for JVM unit tests; use the real implementation there.
    testImplementation 'org.json:json:20240303'

    // Victorious Framework: VictorOps Zombies (libGDX). Game logic lives in :zombies; the Android backend and natives live here.
    implementation project(':zombies')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi -> gdxNatives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi" }

    implementation project(':ae-bridge')
    implementation project(':miniupnp-bridge')
    implementation project(':mupen64plus-audio-android')
    implementation project(':mupen64plus-video-gliden64')
    implementation project(':mupen64plus-video-glide64mk2')
    implementation project(':mupen64plus-video-gln64')
    implementation project(':mupen64plus-rsp-parallel')
    implementation project(':mupen64plus-rsp-cxd4')
    implementation project(':mupen64plus-rsp-hle')
    implementation project(':mupen64plus-input-android')
    implementation project(':mupen64plus-input-raphnet')
    implementation project(':mupen64plus-video-rice')
    implementation project(':mupen64plus-video-angrylion-plus')
    implementation project(':mupen64plus-video-parallel')
    implementation project(':mupen64plus-core')
}


kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
