# Victorious Framework: VictorLink64 debug build.
# Builds and structurally verifies the debug APK only. This workflow never
# creates tags, releases, or published packages, and holds read-only permissions.
name: VictorLink64 debug build

on:
  push:
    branches-ignore: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin

    # Use the Android SDK preinstalled on the runner image. sdkmanager is not
    # on PATH there, so locate the newest cmdline-tools install. Avoids
    # android-actions/setup-android@v3, which requests the removed `tools`
    # package and fails ("Failed to find package 'tools'").
    - name: Install pinned Android SDK packages
      run: |
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
        if [ -z "$SM" ]; then echo "sdkmanager not found under $SDK/cmdline-tools"; ls -la "$SDK" || true; exit 1; fi
        echo "Using $SM"
        yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
        "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
        echo "sdk.dir=$SDK" > local.properties
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

    - name: Install native build helpers
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Verifier unit tests
      run: python3 -I -m unittest discover -s scripts/tests -v

    - name: No APKs or signing keys in the repository
      run: |
        BAD=$(git ls-files | grep -i -E '\.(apk|aab|keystore|jks)$' || true)
        if [ -n "$BAD" ]; then echo "Tracked files that must never be committed:"; echo "$BAD"; exit 1; fi

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Relay unit tests
      working-directory: server/relay
      run: npm test

    - name: JVM unit tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Verify APK payload
      run: |
        APK=app/build/outputs/apk/debug/VictorLink64-debug.apk
        # PSP (PPSSPP), GameCube (Dolphin) and PlayStation 2 (LRPS2) cores ship for arm64-v8a only; check them separately.
        ARM64_ONLY='^(libppsspp_libretro|libdolphin_libretro|liblrps2_libretro)\.so$'
        LIBS=$(unzip -l "$APK" | awk '{print $4}' | grep '^lib/arm64-v8a/' | xargs -n1 basename | grep -Ev "$ARM64_ONLY" | sort | paste -sd,)
        python3 -I scripts/verify_apk_payload.py "$APK" --abis arm64-v8a,armeabi-v7a,x86,x86_64 --libs "$LIBS"
        # The disc cores must be exactly the pinned buildbot binaries (see NOTICE and scripts/fetch-disc-cores.sh);
        # the same run rejects any bundled disc image or PS2 BIOS.
        python3 -I scripts/verify_apk_payload.py "$APK" --abis arm64-v8a \
          --libs libppsspp_libretro.so,libdolphin_libretro.so,liblrps2_libretro.so,libvl64hw.so \
          --expect-sha256 lib/arm64-v8a/libppsspp_libretro.so=0c119025c0c3c1120a5ec2adc9c3d828a298db6c2e2277e2ba7411232ee2fd01 \
          --expect-sha256 lib/arm64-v8a/libdolphin_libretro.so=0fe6a6c25aa05efb06e624f530ab4b2df5249d618259e29c7a95a91da80e7f02 \
          --expect-sha256 lib/arm64-v8a/liblrps2_libretro.so=7fbc421819bade622e04886b1ddb84b0cfdb9bc7a7ad97fdcee824ff82a4df06
        ls -l "$APK"
        sha256sum "$APK"

    - name: Verify 32-bit helper APK
      run: |
        APK=box32/build/outputs/apk/debug/VictorLink64-Box32-debug.apk
        python3 -I scripts/verify_apk_payload.py "$APK" --abis armeabi-v7a --libs libblackbox.so
        # The helper must be 32-bit only and keep its tiny permission list.
        if unzip -l "$APK" | awk '{print $4}' | grep -E '^lib/(arm64-v8a|x86|x86_64)/'; then echo "helper contains non-32-bit-ARM libraries"; exit 1; fi
        "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/box32-badging.txt | grep -E "^package|native-code|uses-permission"
        grep -q "native-code: 'armeabi-v7a'$" /tmp/box32-badging.txt
        test "$(grep -c '^uses-permission' /tmp/box32-badging.txt)" -le 6
        ls -l "$APK"
        sha256sum "$APK"

    - uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: VictorLink64-debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/VictorLink64-debug.apk
        if-no-files-found: error
        retention-days: 7

    - uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: VictorLink64-Box32-debug-${{ github.sha }}
        path: box32/build/outputs/apk/debug/VictorLink64-Box32-debug.apk
        if-no-files-found: error
        retention-days: 7
