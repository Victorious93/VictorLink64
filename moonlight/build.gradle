// Victorious Framework: Moonlight streaming core for VictorLink64 "PC Streaming".
// Vendored from moonlight-stream/moonlight-android (GPL-3.0) at commit b48494cb96bf
// (moonlight-common-c 874ac9548f1b, enet aca87840b57f, nanors b1e3c22ca0cd).
// Only the protocol, pairing, discovery, decoder and audio pieces are kept; the
// Moonlight UI is replaced by VictorLink64's own screens. See moonlight/README.md.
apply plugin: 'com.android.library'
apply from: '../build_common/version_common.gradle'

android {
    namespace = "com.limelight"
    buildFeatures.buildConfig = true

    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            ndkBuild {
                arguments.add("NDK_APPLICATION_MK:=src/main/jni/Application.mk")
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    api 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    api 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.3'
}
